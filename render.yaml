services:
  - type: web
    name: hotel-desk-group3
    runtime: node
    plan: free
    region: singapore
    buildCommand: npx --yes pnpm@10.15.1 install --frozen-lockfile && npx --yes pnpm@10.15.1 build
    startCommand: node dist/server/index.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: HOTEL_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: DEPOSIT_PERCENT
        value: "30"
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_FULL_NAME
        value: Quản trị viên Nhóm 3
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
